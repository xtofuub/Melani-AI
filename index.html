<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Binder — From bytes to clarity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Production React — no dev overhead -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; background: #f8f5ec; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    em { font-style: italic; }
    a { color: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    window.__BINDER_TWEAKS__ = { dark: false, showStrips: true };
    window.__applyBinderTweaks = function() {
      document.getElementById('root').classList.toggle('binder-dark', !!window.__BINDER_TWEAKS__.dark);
      document.body.style.background = window.__BINDER_TWEAKS__.dark ? '#141211' : '#f8f5ec';
    };
  </script>

  <!-- Precompiled JS — no Babel at runtime -->
  <script src="dist/shared.js"></script>
  <script src="dist/effects.js"></script>
  <script src="dist/variation-a-part1.js"></script>
  <script src="dist/variation-a-part2.js"></script>

  <script>
    window.__applyBinderTweaks();
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(VariationA));
  </script>
</body>
</html>
